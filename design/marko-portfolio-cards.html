<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Marko Petkovski — Graphic Design Portfolio</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0d0d0d;--surface:#141414;--card:#1a1a1a;--border:#2a2a2a;--accent:#c9a96e;--accent2:#e8c98a;--text:#f0ece4;--muted:#888}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh;overflow-x:hidden}
body::before{content:'';position:fixed;inset:0;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");pointer-events:none;z-index:1000;opacity:.6}
header{padding:80px 60px 60px;position:relative}
header::after{content:'';position:absolute;bottom:0;left:60px;right:60px;height:1px;background:linear-gradient(90deg,transparent,var(--border),transparent)}
.header-tag{font-size:11px;letter-spacing:4px;text-transform:uppercase;color:var(--accent);margin-bottom:20px;display:block}
.header-title{font-family:'Playfair Display',serif;font-size:clamp(42px,6vw,80px);font-weight:900;line-height:1;letter-spacing:-2px}
.header-title em{font-style:italic;color:var(--accent)}
.header-sub{margin-top:20px;font-size:15px;color:var(--muted);max-width:460px;line-height:1.7;font-weight:300}
main{padding:80px 60px;max-width:1400px;margin:0 auto}
.section-label{font-size:11px;letter-spacing:4px;text-transform:uppercase;color:var(--muted);margin-bottom:50px;display:flex;align-items:center;gap:16px}
.section-label::after{content:'';flex:1;height:1px;background:var(--border)}
.block+.block{margin-top:100px}
.projects-grid{display:grid;grid-template-columns:1fr;gap:40px}
/* project card */
.project-card{background:var(--card);border:1px solid var(--border);overflow:hidden;transition:border-color .3s;animation:fadeUp .7s ease both}
.project-card:hover{border-color:var(--accent)}
@keyframes fadeUp{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:none}}
.hero-img{margin:16px 16px 0;aspect-ratio:16/9;background:#111;overflow:hidden;cursor:zoom-in;position:relative}
.hero-img img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .5s}
.hero-img:hover img{transform:scale(1.03)}
.thumbs{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;padding:12px 16px 16px}
.thumbs div{grid-column:span 2;aspect-ratio:16/9;background:#111;overflow:hidden;cursor:zoom-in}
.thumbs div:nth-child(n+4){grid-column:span 3}
.thumbs img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .5s}
.thumbs div:hover img{transform:scale(1.03)}
.card-body{padding:20px 32px 36px}
.card-header{display:flex;justify-content:space-between;margin-bottom:14px}
.card-number{font-size:11px;letter-spacing:3px;color:var(--accent)}
.card-count{font-size:11px;letter-spacing:2px;color:var(--muted);text-transform:uppercase}
.card-type{font-size:11px;letter-spacing:3px;text-transform:uppercase;color:var(--accent);margin-bottom:16px}
.card-title{font-family:'Playfair Display',serif;font-size:26px;font-weight:700;margin-bottom:8px;letter-spacing:-.5px}
.card-desc{font-size:14px;color:var(--muted);line-height:1.8;font-weight:300;margin-bottom:24px}
.card-tags{display:flex;flex-wrap:wrap;gap:8px}
.tag{font-size:10px;letter-spacing:2px;text-transform:uppercase;padding:5px 12px;border:1px solid var(--border);color:var(--muted);border-radius:2px}
.card-stats{display:flex;gap:32px;margin-top:24px;padding-top:24px;border-top:1px solid var(--border)}
.stat{display:flex;flex-direction:column;gap:4px}
.stat-val{font-family:'Playfair Display',serif;font-size:22px;font-weight:700}
.stat-label{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--muted)}
/* tiles */
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:20px}
.tile{background:var(--card);border:1px solid var(--border);aspect-ratio:1;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative;transition:border-color .3s;animation:fadeUp .7s ease both}
.tile:hover{border-color:var(--accent)}
.tile.print{aspect-ratio:3/4}
.tile img{width:100%;height:100%;object-fit:contain;display:block;cursor:zoom-in}
.tile.print img{object-fit:cover}
.tile .n{position:absolute;left:14px;top:12px;font-size:10px;letter-spacing:3px;color:var(--accent);z-index:2}
.tile.empty{border-style:dashed;flex-direction:column;gap:8px;color:#555;font-size:10px;letter-spacing:3px;text-transform:uppercase;text-align:center}
.tile.empty b{font-family:'Playfair Display',serif;font-size:26px;font-weight:400;color:#3a3a3a;letter-spacing:0}
#print{display:block;columns:3;column-gap:20px}
#print .tile{display:block;aspect-ratio:auto;break-inside:avoid;margin-bottom:20px}
#print .tile img{height:auto;object-fit:fill}
#print .tile .n{display:none}
/* black and white by default, full color on hover */
.hero-img img,.thumbs img,.tile img{filter:grayscale(1);transition:transform .5s,filter .5s}
.hero-img:hover img,.thumbs div:hover img,.tile:hover img{filter:grayscale(0)}
@media(hover:none){.hero-img img,.thumbs img,.tile img{filter:none}}
@media(max-width:700px){#print{columns:2;column-gap:12px}#print .tile{margin-bottom:12px}}
.brief{display:grid;grid-template-columns:repeat(3,1fr);gap:32px;margin-bottom:28px}
.brief h4{font-size:11px;letter-spacing:3px;text-transform:uppercase;color:var(--accent);font-weight:500;margin-bottom:10px}
.brief p{font-size:14px;color:var(--muted);line-height:1.8;font-weight:300}
@media(max-width:900px){.brief{grid-template-columns:1fr;gap:20px}}
/* lightbox */
.lb{position:fixed;inset:0;background:rgba(0,0,0,.94);z-index:2000;display:none;align-items:center;justify-content:center;padding:40px;cursor:zoom-out}
.lb.open{display:flex}
.lb img{max-width:100%;max-height:100%;object-fit:contain}
.lb button{position:absolute;top:50%;background:none;border:1px solid var(--border);color:var(--text);width:48px;height:48px;font-size:20px;cursor:pointer}
.lb button:hover{border-color:var(--accent);color:var(--accent)}
.lb .p{left:24px}.lb .x{right:24px}
footer{padding:36px 60px;border-top:1px solid var(--border);font-size:12px;color:var(--muted);display:flex;justify-content:space-between;max-width:1400px;margin:0 auto}
@media(max-width:700px){footer{padding:28px 24px;flex-direction:column;gap:8px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
@media(max-width:1000px){.tiles{grid-template-columns:repeat(3,1fr)}}
@media(max-width:900px){.projects-grid{grid-template-columns:1fr}}
@media(max-width:700px){.thumbs{gap:8px;padding:8px 10px 12px}.hero-img{margin:10px 10px 0}header,main,footer{padding-left:24px;padding-right:24px}header::after{left:24px;right:24px}.tiles{grid-template-columns:repeat(2,1fr)}.card-stats{flex-wrap:wrap;gap:20px}.card-body{padding:24px}}

/* ===== SITE MENU ===== */
.site-nav{position:sticky;top:0;z-index:200;background:rgba(13,13,13,.88);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-bottom:1px solid var(--border)}
.site-nav-inner{max-width:1400px;margin:0 auto;height:72px;padding:0 60px;display:flex;align-items:center;justify-content:space-between}
.site-mark{font-family:'Playfair Display',serif;font-size:20px;font-weight:700;color:var(--text);text-decoration:none}
.site-links{list-style:none;display:flex;gap:36px}
.site-links a{font-size:13px;color:var(--muted);text-decoration:none;padding:6px 0;border-bottom:1px solid transparent;transition:color .2s,border-color .2s}
.site-links a:hover{color:var(--accent)}
.site-links a[aria-current]{color:var(--text);border-bottom-color:var(--accent)}
.site-nav-toggle{display:none;background:none;border:1px solid var(--border);width:44px;height:44px;border-radius:2px;cursor:pointer;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.site-nav-toggle span{display:block;width:18px;height:1px;background:var(--text);transition:transform .25s}
.site-nav-toggle[aria-expanded="true"] span:first-child{transform:translateY(3.5px) rotate(45deg)}
.site-nav-toggle[aria-expanded="true"] span:last-child{transform:translateY(-3.5px) rotate(-45deg)}
.site-nav a:focus-visible,.site-nav button:focus-visible{outline:2px solid var(--accent);outline-offset:4px}
header{padding-top:56px!important}
@media(max-width:700px){
  .site-nav-inner{height:64px;padding:0 24px}
  .site-nav-toggle{display:flex}
  .site-links{display:none;position:absolute;top:64px;left:0;right:0;flex-direction:column;gap:0;background:#0d0d0d;border-bottom:1px solid var(--border);padding:8px 24px 16px}
  .site-links.open{display:flex}
  .site-links a{display:block;padding:16px 0;font-size:15px;border-bottom:1px solid var(--border)}
  .site-links li:last-child a{border-bottom:none}
  .site-links a[aria-current]{border-bottom-color:var(--border);color:var(--accent)}
  header{padding-top:40px!important}
}
</style>
</head>
<body>
<nav class="site-nav" aria-label="Main">
  <div class="site-nav-inner">
    <a class="site-mark" href="../index.html" aria-label="Marko Petkovski, home">MP</a>
    <button class="site-nav-toggle" aria-expanded="false" aria-controls="siteLinks" aria-label="Menu"><span></span><span></span></button>
    <ul class="site-links" id="siteLinks">
      <li><a href="../index.html">Home</a></li>
      <li><a href="../portfolio/portfolio.html">Websites</a></li>
      <li><a href="../design/marko-portfolio-cards.html" aria-current="page">Designs</a></li>
      <li><a href="../index.html#about">About</a></li>
    </ul>
  </div>
</nav>
<script>
(function(){var b=document.querySelector('.site-nav-toggle'),l=document.getElementById('siteLinks');
b.addEventListener('click',function(){var o=l.classList.toggle('open');b.setAttribute('aria-expanded',o)});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&l.classList.contains('open')){l.classList.remove('open');b.setAttribute('aria-expanded','false');b.focus()}});})();
</script>

<header>
  <span class="header-tag">Selected Work — Novi Sad, Serbia</span>
  <h1 class="header-title">My <em>Designs</em></h1>
  <p class="header-sub">Branding, print and graphic design work created for real clients over ten years. Click any image to view it full size.</p>
</header>
<main>
  <div class="block"><div class="section-label">Projects</div><div class="projects-grid" id="projects"></div></div>
  <div class="block"><div class="section-label">Standalone Designs</div><div class="tiles" id="print"></div></div>
</main>
<footer>
  <span>© <span id="yr"></span> Marko Petkovski</span>
  <span>Novi Sad, Serbia</span>
</footer>
<script>document.getElementById('yr').textContent = new Date().getFullYear();</script>
<div class="lb" id="lb"><button class="p" aria-label="Previous">←</button><img id="lbimg" alt=""/><button class="x" aria-label="Next">→</button></div>

<script>
/* ===== EDIT HERE ===== */
const BASE='https://marko-design.my.canva.site/images/';
/* Other graphics: any number of images (masonry layout). */
const prints=['./w1.jpg','./w2.jpg','./w3.jpg','./w4.jpg','./w5.jpg','./w6.jpg','./w7.jpg','./w8.jpg','./w9.jpg','./w10.jpg','./w11.jpg','./w12.jpg','./w13.jpg','./w14.jpg','./w15.jpg','./w16.jpg'];
/* Projects: 6 images each. */
const projects=[
 {title:'Grove Bags',type:'Branding & Packaging',year:'2020',tags:['Logo','Print Materials','Pouch Design','Packaging'],label:"Premium cannabis packaging",desc:{brief:"Grove Bags makes custom pouches for cannabis packaging and needed a complete visual identity to launch: a logo, print materials and pouch designs that cannabis brands would want to put their products in.",challenge:"Cannabis packaging is a crowded, heavily regulated market where most products look alike. The brand had to feel premium and trustworthy, and stay consistent across print pieces and several pouch sizes.",solution:"I designed a clean leaf mark paired with a bold and light sans-serif wordmark, built around a simple green, black and white palette. I then extended it to print materials and custom pouch designs in various sizes, so every piece reads as one brand."},ids:['./gb1.jpg','./gb2.jpg','./gb3.jpg','./gb4.jpg','./gb5.jpg','./gb6.jpg']},
 {title:'Inmoaction',type:'Branding & Print Marketing',year:'2024',tags:['Logo','Branding','Print Marketing','Real Estate'],label:"Real estate — Valencia, Spain",desc:{brief:"Inmoaction is a real estate company in Valencia, Spain. They needed a new visual identity and a full range of print marketing materials to present the business professionally to buyers, sellers and renters.",challenge:"Real estate is a competitive, trust-driven market where clients judge a company by how it looks before they ever meet an agent. The brand had to feel credible and recognizable, and stay consistent across many different print pieces.",solution:"I designed the logo and built a complete branding system around it, then applied it to all kinds of print marketing materials. Using one set of colors, type and layouts throughout makes every piece clearly recognizable as Inmoaction."},ids:['./inmoaction1.jpg','./inmoaction2.jpg','./inmoaction3.jpg','./inmoaction4.jpg','./inmoaction5.jpg','./inmoaction6.jpg']},
 {title:'Aurora Organics',type:'Visual Identity & Social Media',year:'2023',tags:['Visual Identity','Typography','Social Media','Digital Graphics'],label:"Organic products brand",desc:{brief:"Aurora Organics, a brand built around organic products, wanted a fresh and natural look that would feel consistent everywhere customers meet it, especially online.",challenge:"Feeds and shelves are full of brands promising natural quality, and many fall back on the same green leaves and earthy cliches. Aurora needed a look that felt honest and distinctive, yet simple enough to reuse across many posts and formats.",solution:"I built a flexible visual system from a considered color palette, typography and reusable layouts. On top of it I created a set of digital and social media graphics, so the brand keeps one clear voice from one post to the next."},ids:['./aurora1.jpg','./aurora2.jpg','./aurora3.jpg','./aurora4.jpg','./aurora5.jpg','./aurora6.jpg']},
 {title:'Flowline',type:'Apparel, Vehicle & Environmental Design',year:'2023',tags:['Apparel','Vehicle Design','Entrance Design','Promo Materials'],label:"Brand in the real world",desc:{brief:"Flowline wanted its brand to be seen well beyond paper and screens: on clothing, on vehicles, at the entrance of its building and across its promotional materials.",challenge:"Each surface is a different shape and scale. A design that works on a shirt can fall apart on the side of a car or above a doorway, yet people should still recognize it as Flowline everywhere.",solution:"I created an adaptable set of graphics and a consistent color and type approach, then fitted it to each surface in turn: shirt designs, car graphics, the building entrance and a range of promotional pieces. The result is one brand that looks at home wherever it appears."},ids:['./fl1.jpg','./fl2.jpg','./fl3.jpg','./fl4.jpg','./fl5.jpg','./fl6.jpg']},
 {title:'Nordic Arc',type:'Graphic & Web Design',year:'2022',tags:['Graphic Design','Web Design','Brand Graphics','Sustainability'],label:"Sustainable materials & green roofs",desc:{brief:"Nordic Arc develops sustainable materials and innovations, including green roofs. They needed graphic and web design that would explain a technical, forward-looking offer to clients and partners.",challenge:"Their products are innovative but not easy to explain at a glance, and the audience ranges from builders and architects to everyday property owners. The design had to be credible and clear, and feel genuinely sustainable without falling back on clichés.",solution:"I combined graphic and web design into one consistent look: a calm, natural palette, clean typography and clear visuals that make technical ideas easy to follow. The same graphics run through the website and the supporting materials, so the story stays unified wherever people meet the brand."},ids:['./nordic1.jpg','./nordic2.jpg','./nordic3.jpg','./nordic4.jpg','./nordic5.jpg','./nordic6.jpg']},
 {title:'Nexus Symposium',type:'Event Design',year:'2022',tags:['Event Branding','Booth Design','Signage','Print'],label:"Event design",desc:{brief:"Nexus Symposium needed the full look of an event designed from scratch: its branding, the booth, flyers, signs, banners and speaker cards, all ready for the day.",challenge:"An event has to work at every distance. Attendees meet it first on a flyer, then on signs and banners that must be read from across a room, and finally at the booth and on the speaker cards up close. Everything had to look related, and be ready on a fixed date.",solution:"I created an event identity first, then designed each piece for its viewing distance and setting, from the booth and large banners to flyers, signs and speaker cards. A shared palette, type and graphic language ties the whole event together."},ids:['./nexus1.jpg','./nexus2.jpg','./nexus3.jpg','./nexus4.jpg','./nexus5.jpg','./nexus6.jpg']},
];
const DESC='A short description of this project goes here: the client, the brief and what you designed.';
/* ===================== */
const U=s=>/^https?:|^\.|^\//.test(s)?s:BASE+s, n2=n=>String(n).padStart(2,'0');
const all=[];            // flat list for the lightbox, grouped by set
let set=[],cur=0;
const reg=(arr)=>arr.map(s=>U(s));
function tiles(el,arr,label,cls){
  const urls=arr.filter(Boolean).map(U);
  el.innerHTML=arr.map((s,i)=>{
    const d=`style="animation-delay:${(i%4)*.06}s"`;
    if(!s)return `<div class="tile empty ${cls}" ${d}><b>${n2(i+1)}</b>${label} placeholder</div>`;
    return `<div class="tile ${cls}" ${d}><span class="n">${n2(i+1)}</span><img src="${U(s)}" alt="${label} ${i+1}" loading="lazy" data-set="${el.id}" data-i="${urls.indexOf(U(s))}"/></div>`;
  }).join('');
  all[el.id]=urls;
}
tiles(document.getElementById('print'),prints,'Design','mason');
document.getElementById('projects').innerHTML=projects.map((p,i)=>{
  const id='p'+i,u=p.ids.map(U);all[id]=u;
  return `<div class="project-card" style="animation-delay:${.1+i*.05}s">
   <div class="hero-img"><img src="${u[0]}" alt="${p.title}" data-set="${id}" data-i="0"/></div>
   <div class="thumbs">${u.slice(1).map((s,j)=>`<div><img src="${s}" alt="${p.title} ${j+2}" loading="lazy" data-set="${id}" data-i="${j+1}"/></div>`).join('')}</div>
   <div class="card-body">
    <div class="card-header"><span class="card-number">${n2(i+1)}</span><span class="card-count">${p.label||u.length+' images'}</span></div>
    <div class="card-type">${p.type}</div><h2 class="card-title">${p.title}</h2>${p.desc?`<div class="brief"><div><h4>Client Brief</h4><p>${p.desc.brief}</p></div><div><h4>Challenge</h4><p>${p.desc.challenge}</p></div><div><h4>Solution</h4><p>${p.desc.solution}</p></div></div>`:`<p class="card-desc">${DESC}</p>`}
    <div class="card-tags">${p.tags.map(t=>`<span class="tag">${t}</span>`).join('')}</div>
    <div class="card-stats"><div class="stat"><span class="stat-val">${p.year}</span><span class="stat-label">Year</span></div><div class="stat"><span class="stat-val">${u.length}</span><span class="stat-label">Pieces</span></div></div>
   </div></div>`;
}).join('');
/* lightbox */
const lb=document.getElementById('lb'),im=document.getElementById('lbimg');
const show=i=>{cur=(i+set.length)%set.length;im.src=set[cur];lb.classList.add('open')};
document.addEventListener('click',e=>{
  const t=e.target;
  if(t.matches('img[data-set]')){set=all[t.dataset.set];return show(+t.dataset.i)}
  if(!lb.classList.contains('open'))return;
  if(t.closest('.p')){show(cur-1);return}
  if(t.closest('.x')){show(cur+1);return}
  lb.classList.remove('open');
});
document.addEventListener('keydown',e=>{
  if(!lb.classList.contains('open'))return;
  if(e.key==='Escape')lb.classList.remove('open');
  if(e.key==='ArrowLeft')show(cur-1);
  if(e.key==='ArrowRight')show(cur+1);
});
</script>
</body>
</html>
